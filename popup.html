<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TG→FB 转发</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand-icon" src="icons/icon48.png" width="44" height="44" alt="" />
      <div class="brand-text">
        <h1>TG → FB 转发</h1>
        <p>在 Telegram 页面里配置 FB 群，并在发言者下方勾选转发</p>
      </div>
    </header>

    <section class="card">
      <label for="tgGroupUrl">Telegram 群链接（可选，推荐填写）</label>
      <input
        id="tgGroupUrl"
        type="url"
        placeholder="https://web.telegram.org/a/#-1001234567890"
      />
      <button id="openTgTabBtn" type="button" class="primary-large">打开 Telegram 监听标签页</button>
      <p class="hint">须为 <code>web.telegram.org/a/#-100…</code>（从浏览器地址栏复制，勿用全 0 的假 ID）。若页面一直转圈：先登录 TG，或留空链接打开首页再从左侧进群。加载出聊天列表后，在<strong>顶部蓝条</strong>配置 FB 并勾选发言者。</p>
    </section>

    <p id="status" class="status" hidden></p>

    <footer>
      <p>请保持该 TG 标签页不要关闭，并登录 Telegram / Facebook。</p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
